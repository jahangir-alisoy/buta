server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  tomcat:
    remoteip:
      internal-proxies: ${APP_TRUSTED_PROXIES:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: buta
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:buta}?sslmode=${DB_SSL_MODE:prefer}
    username: ${DB_USER:buta}
    password: ${DB_PASSWORD:buta}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${APP_LIQUIBASE_CONTEXTS:default,demo}
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  threads:
    virtual:
      enabled: true

springdoc:
  api-docs:
    enabled: ${APP_API_DOCS_ENABLED:true}
    path: /api/v1/docs/openapi
  swagger-ui:
    enabled: ${APP_API_DOCS_ENABLED:true}
    path: /api/v1/docs

app:
  demo-mode: ${APP_DEMO_MODE:true}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  allowed-origins: ${APP_ALLOWED_ORIGINS:}
  business-time-zone: Asia/Baku
  admin-emails: ${APP_ADMIN_EMAILS:admin@buta.test}
  ip-hash-secret: ${APP_IP_HASH_SECRET:dev-only-ip-hash-secret-change-me-0123456789}
  session:
    cookie-name: ${APP_SESSION_COOKIE_NAME:buta_session}
    cookie-secure: ${APP_SESSION_COOKIE_SECURE:false}
    cookie-same-site: ${APP_COOKIE_SAME_SITE:Lax}
    idle-timeout: ${APP_SESSION_IDLE_TIMEOUT:P7D}
    absolute-timeout: ${APP_SESSION_ABSOLUTE_TIMEOUT:P30D}
    admin-idle-timeout: ${APP_SESSION_ADMIN_IDLE_TIMEOUT:PT12H}
    touch-interval: PT5M
  otp:
    pepper: ${APP_OTP_PEPPER:dev-only-otp-pepper-change-me-0123456789abcdef}
    ttl: ${APP_OTP_TTL:PT10M}
    max-attempts: ${APP_OTP_MAX_ATTEMPTS:5}
    resend-cooldown: ${APP_OTP_RESEND_COOLDOWN:PT60S}
    max-per-email-per-hour: ${APP_OTP_MAX_PER_EMAIL_HOUR:5}
    max-per-ip-per-hour: ${APP_OTP_MAX_PER_IP_HOUR:20}
    max-verifications-per-ip: ${APP_OTP_MAX_VERIFY_PER_IP:30}
    verification-window: PT10M
    lockout-threshold: 3
    lockout-window: PT1H
    lockout-duration: PT30M
  mail:
    provider: smtp
    from: "Naxış <${MAIL_USERNAME:no-reply@buta.test}>"
    dev-mailbox-enabled: ${APP_DEV_MAILBOX_ENABLED:false}
  payment:
    provider: ${APP_PAYMENT_PROVIDER:sandbox}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  storage:
    provider: ${APP_STORAGE_PROVIDER:database}
    local-dir: ${APP_STORAGE_LOCAL_DIR:./data/uploads}
    avatar-max-bytes: ${APP_AVATAR_MAX_BYTES:2097152}
